# TownySMP physical auction showcases
# Palette: TOWNY #FF55FF, SMP #55FF55, then cyan/yellow/red/gray/white accents.

settings:
  # There is no required minimum or slot cap: one showcase works, and 12 or more work too.

  # AxAuctions is polled on the main thread every 5 seconds (20 ticks = 1 second).
  update-interval-ticks: 100

  # Floating item animation.
  rotation-interval-ticks: 2
  rotation-degrees-per-step: 1.8
  item-scale: 0.85

  # Look at the lower block. +1.50 places the item exactly in the centre of the block above it.
  item-y-offset: 1.50

  # A compact, clickable wall sign replaces the floating text hologram.
  # Any valid *_WALL_SIGN material can be used here.
  sign-material: DARK_OAK_WALL_SIGN
  sign-glowing-text: false
  sign-layout-version: 2
  # Maximum 15 characters so the instruction remains readable on one sign line.
  sign-buy-text: "RIGHT-CLICK BUY"

  # Sends the seller a private success message containing the real item display name.
  # Set AxAuctions' own `sell.success` in lang.yml to an empty string to avoid duplicates.
  custom-sell-message-enabled: true

  # The invisible click target around the floating item remains available too.
  # This lets the physical item remain behind glass while both item and sign clicks work.
  interaction-forward-offset: 0.72
  interaction-y-offset: 0.25
  interaction-width: 1.35
  interaction-height: 2.25
  click-cooldown-millis: 750

  # Used only if the installed AxAuctions build exposes no exact expiry date.
  fallback-listing-duration-seconds: 172800

  # Clicking a currently empty showcase opens the full auction house.
  empty-slot-command: ah

# Created automatically by /ahdisplay set <slot>.
slots: {}
